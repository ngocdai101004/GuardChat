# Qwen3Guard - Task 1 (Zero-Shot Multi-Label Unsafe Text Recognition).
#
# Qwen/Qwen3Guard-Gen-8B is loaded from a local snapshot under weights/.
# There is no training - this is a pure inference baseline. This file
# documents the defaults of `python -m src.Qwen3Guard.eval_recognition`;
# the CLI flags are the source of truth.
#
# Library versions (tested):
#   torch              >= 2.1
#   transformers       >= 4.51, < 5   (Qwen3 architecture)
#   accelerate         >= 0.26
#   huggingface_hub    >= 0.23        (snapshot_download)
#   bitsandbytes       >= 0.43        (only for dtype: int8 / nf4, CUDA)

data:
  test: build_dataset/dataset/final_df_test.json
  text_kind: all                      # 'prompt' | 'raw_prompt' | 'conversation' | 'all'
  conv_format: concat                 # 'concat' = flattened, like the other baselines
                                      # 'turns'  = real turn list (this template
                                      #            accepts repeated user turns)
  role_prefix: true                   # prefix each concatenated turn with 'user: '

model:
  weights: src/Qwen3Guard/weights/Qwen3Guard-Gen-8B   # fetched on first run
  repo_id: Qwen/Qwen3Guard-Gen-8B                     # source of that snapshot
  auto_download: true                 # populate `weights` when it is empty
  mode: guardchat                     # 'guardchat' = GuardChat's 6 categories replace
                                      #               the shipped 9 (class counts match)
                                      # 'native'    = Qwen3Guard's own 9 categories
  dtype: auto                         # auto | bfloat16 | float16 | float32 | int8 | nf4
  device: auto                        # auto | cuda | mps | cpu

severity:
  # Qwen3Guard grades Safe / Controversial / Unsafe. GuardChat needs a
  # binary verdict, so the middle level has to be assigned.
  controversial_as_unsafe: true       # strict moderation (--controversial unsafe)
                                      # false = lenient (--controversial safe)

generation:
  max_new_tokens: 64                  # 'Safety: Unsafe\nCategories: A, B' fits easily
  do_sample: false

output:
  dir: experiment_results/task1/qwen3guard
  files:
    - qwen3guard_task1_prompt.json
    - qwen3guard_task1_raw_prompt.json
    - qwen3guard_task1_conversation.json
