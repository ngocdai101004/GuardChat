# LlamaGuard - Task 1 (Zero-Shot Multi-Label Unsafe Text Recognition).
#
# meta-llama/Llama-Guard-3-8B is loaded from a local snapshot under
# weights/. There is no training - this is a pure inference baseline.
# This file documents the defaults of
# `python -m src.LlamaGuard.eval_recognition`; the CLI flags are the
# source of truth.
#
# Library versions (tested):
#   torch              >= 2.1
#   transformers       >= 4.43, < 5   (Llama 3.1 architecture)
#   accelerate         >= 0.26
#   huggingface_hub    >= 0.23        (snapshot_download)
#   bitsandbytes       >= 0.43        (only for dtype: int8 / nf4, CUDA)

data:
  test: build_dataset/dataset/final_df_test.json
  text_kind: all                      # 'prompt' | 'raw_prompt' | 'conversation' | 'all'
  conv_format: concat                 # 'concat' = flattened, like the other baselines
                                      # 'turns'  = real turn list; the template demands
                                      #            strict user/assistant alternation, so
                                      #            same-role turns are merged first
  role_prefix: true                   # prefix each concatenated turn with 'user: '

model:
  weights: src/LlamaGuard/weights/Llama-Guard-3-8B   # fetched on first run
  repo_id: meta-llama/Llama-Guard-3-8B               # source of that snapshot
  auto_download: true                 # populate `weights` when it is empty
  mode: guardchat                     # 'guardchat' = GuardChat's 6 categories in the
                                      #               chat template (class counts match)
                                      # 'native'    = Llama-Guard's own S1-S14 taxonomy
  dtype: auto                         # auto | bfloat16 | float16 | float32 | int8 | nf4
  device: auto                        # auto | cuda | mps | cpu

generation:
  max_new_tokens: 20                  # 'safe' / 'unsafe\nS3,S11' fits easily
  do_sample: false

output:
  dir: experiment_results/task1/llamaguard
  files:
    - llamaguard_task1_prompt.json
    - llamaguard_task1_raw_prompt.json
    - llamaguard_task1_conversation.json
