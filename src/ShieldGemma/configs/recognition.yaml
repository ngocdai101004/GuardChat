# ShieldGemma - Task 1 (Zero-Shot Multi-Label Unsafe Text Recognition).
#
# google/shieldgemma-2b is loaded from the Hub or from a local snapshot
# under weights/. There is no training - this is a pure inference
# baseline. The file documents the defaults of
# `python -m src.ShieldGemma.eval_recognition`; the CLI flags are the
# source of truth.
#
# Library versions (tested):
#   torch              >= 2.1
#   transformers       >= 4.42, < 5   (Gemma-2 architecture)
#   accelerate         >= 0.26
#   huggingface_hub    >= 0.20        (snapshot_download)
#   bitsandbytes       >= 0.43        (only for dtype: int8 / nf4, CUDA)

data:
  test: build_dataset/dataset/final_df_test.json
  text_kind: all                      # 'prompt' | 'raw_prompt' | 'conversation' | 'all'
  role_prefix: true                   # prefix each concatenated turn with 'user: '

model:
  weights: src/ShieldGemma/weights/shieldgemma-2b   # fetched on first run
  repo_id: google/shieldgemma-2b                    # source of that snapshot
  auto_download: true                 # populate `weights` when it is empty
  mode: guardchat                     # 'guardchat' = 6 policies, one per category
                                      # 'native'    = ShieldGemma's 4 published policies
  dtype: auto                         # auto | bfloat16 | float16 | float32 | int8 | nf4
  device: auto                        # auto | cuda | mps | cpu
  batch_size: 4                       # policy prompts per forward pass
  max_length: 4096

scoring:
  # ShieldGemma emits P(Yes) for "does this violate the policy?"; a
  # category fires at or above this cut-off. Raw scores are stored in the
  # output JSON, so the threshold can be re-tuned without re-running.
  threshold: 0.5

output:
  dir: experiment_results/task1/shieldgemma
  files:
    - shieldgemma_task1_prompt.json
    - shieldgemma_task1_raw_prompt.json
    - shieldgemma_task1_conversation.json
